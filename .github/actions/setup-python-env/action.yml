name: "Setup Python Environment"
description: "Set up Python and uv, then sync the workspace (all packages, frozen lock)."

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.11"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-suffix: ${{ inputs.python-version }}

    # Pin uv to the matrix interpreter, otherwise uv picks its own newest Python
    # (e.g. 3.13) and every matrix cell would test the same version.
    - name: Install workspace dependencies
      run: uv sync --all-packages --frozen --python "${{ inputs.python-version }}"
      shell: bash
      env:
        UV_PYTHON: ${{ inputs.python-version }}
