name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.13

      - name: Ruff check
        run: >
          uvx ruff check
          agentura-commons/src/
          email-agent/src/
          document-agent/src/
          agentura-ui/src/
          filesystem-agent/src/

      - name: Ruff format check
        run: >
          uvx ruff format --check
          agentura-commons/src/
          email-agent/src/
          document-agent/src/
          agentura-ui/src/
          filesystem-agent/src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.13

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc libmagic1

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests (CI tier)
        timeout-minutes: 8
        run: |
          # Each package uses its own addopts from pyproject.toml.
          # Packages without addopts get -m "not integration" here.
          for pkg in agentura-commons email-agent document-agent filesystem-agent; do
            echo "=== $pkg ==="
            (cd "$pkg" && uv run pytest tests/ --timeout=60 --tb=short -q)
          done
