name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.13

      - name: Ruff check
        run: >
          uvx ruff check
          agentura-commons/src/
          email-agent/src/
          document-agent/src/
          agentura-ui/src/
          filesystem-agent/src/

      - name: Ruff format check
        run: >
          uvx ruff format --check
          agentura-commons/src/
          email-agent/src/
          document-agent/src/
          agentura-ui/src/
          filesystem-agent/src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.13

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run tests (CI tier)
        timeout-minutes: 5
        run: >
          uv run pytest
          agentura-commons/tests/
          email-agent/tests/
          document-agent/tests/
          -m "not integration"
          --timeout=60
          --tb=short -q
