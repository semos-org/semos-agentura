name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks (lock, pre-commit, ty, deptry)
        run: make check

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation (strict)
        run: make docs-test

  tests:
    needs: quality
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # pandoc lets the document package's composition tests run instead of skipping
      # (they guard with needs_pandoc), so install it on every OS. Heavier render tools
      # (mmdc, drawio, libreoffice, browsers) are not installed: those tests either
      # skip via needs_* guards or degrade gracefully with a warning.
      # (Cross-package e2e composition runs in the separate `integration` job.)
      - name: Install pandoc
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y pandoc ;;
            macOS)   brew install pandoc ;;
            Windows) choco install pandoc -y --no-progress ;;
          esac

      - name: Install Playwright chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            uv run playwright install --with-deps chromium
          else
            uv run playwright install chromium
          fi

      # Each package runs from its own dir so it picks up its own pyproject
      # [tool.pytest] config and conftest (Windows-only COM tests skipif-skip).
      - name: Run tests with coverage
        run: |
          for pkg in semos-agentura-core semos-agentura-email semos-agentura-document semos-agentura-files; do
            echo "=== $pkg ==="
            (cd "packages/$pkg" && uv run pytest tests/ --timeout=60 --tb=short -q \
              --cov=src/ --cov-report=xml:../../coverage-$pkg.xml)
          done

      - name: Upload coverage to Codecov
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-semos-agentura-core.xml,coverage-semos-agentura-email.xml,coverage-semos-agentura-document.xml,coverage-semos-agentura-files.xml
          fail_ci_if_error: false

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # Cross-package e2e: agents are started with mocked backends, but the real-compose
      # tests need pandoc (else they skipif-skip). Browser/OCR/LLM paths are mocked or skipped.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run cross-package integration tests
        run: make test-integration
