[project]
name = "agentura-ui"
dynamic = ["version"]
description = "Panel-based chat client for Semos Agentura MCP agents"
requires-python = ">=3.11"
dependencies = [
    "panelini[ai]",
    "filesystem-agent",
    "litellm>=1.30.0,!=1.82.7,!=1.82.8",
    "langchain-community>=0.3",
    "mcp>=1.9",
    "a2a-sdk>=1.0.0a0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "python-magic-bin>=0.4.14; sys_platform != 'linux'",
    "python-magic>=0.4.27; sys_platform == 'linux'",
]

[tool.uv.sources]
filesystem-agent = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, one level up from this package.
raw-options = { root = ".." }

[tool.deptry.per_rule_ignores]
# litellm/a2a-sdk are invoked indirectly via agentura-commons; python-magic(-bin) provides the
# libmagic bindings loaded at runtime for file-type detection.
DEP002 = ["litellm", "a2a-sdk", "python-magic", "python-magic-bin"]
# Transitive: panel via panelini[ai], uvicorn & langchain_core via their parents, and
# agentura_commons via the filesystem-agent workspace dependency.
DEP003 = ["panel", "agentura_commons", "uvicorn", "langchain_core"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentura_ui"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ui: browser tests requiring Playwright"]
