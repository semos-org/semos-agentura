[project]
name = "agentura-ui"
dynamic = ["version"]
description = "Panel-based chat client for Semos Agentura MCP agents"
requires-python = ">=3.11"
dependencies = [
    "panelini[ai]",
    "agentura-commons",
    "filesystem-agent",
    "langchain-community>=0.3",
    "langchain-core>=1.0",
    "mcp>=1.9",
    "httpx>=0.28",
    "panel>=1.7",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[tool.uv.sources]
agentura-commons = { workspace = true }
filesystem-agent = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, one level up from this package.
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/agentura_ui"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ui: browser tests requiring Playwright"]
