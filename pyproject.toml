[project]
name = "semos-agentura"
version = "0.2.0"
description = "Semos Agentura - Multi-agent system with MCP + A2A"
requires-python = ">=3.13"
dependencies = [
    "agentura-commons",
    "email-agent",
    "document-agent",
    "filesystem-agent",
    "agentura-ui",
]

[tool.uv.workspace]
members = [
    "agentura-commons",
    "email-agent",
    "document-agent",
    "filesystem-agent",
    "agentura-ui",
]

[tool.uv.sources]
agentura-commons = { workspace = true }
email-agent = { workspace = true }
document-agent = { workspace = true }
filesystem-agent = { workspace = true }
agentura-ui = { workspace = true }
panelini = { git = "https://github.com/opensemanticworld/panelini.git", branch = "dev-agentura" }

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Each package runs tests from its own dir (cd pkg && uv run pytest tests/)
# to pick up its own pyproject.toml [tool.pytest] config and conftest.py.
markers = [
    "integration: requires real backend credentials (COM, IMAP, SharePoint, LLM API keys) - excluded in CI",
    "playwright: uses Playwright browser automation (chromium installed in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",   # module import not at top (load_dotenv before imports)
    "E501",   # line too long (handled by formatter)
    "UP042",  # str+Enum -> StrEnum (keep compat with older Python if needed)
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-httpx>=0.30",
    "pytest-playwright>=0.7",
    "pytest-timeout>=2.3",
]
