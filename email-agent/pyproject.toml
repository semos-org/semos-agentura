[project]
name = "email-agent"
dynamic = ["version"]
description = "Unified email client — IMAP/SMTP + Outlook COM, with LLM agent and archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentura-commons",
    "msal>=1.34.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "litellm>=1.30.0,!=1.82.7,!=1.82.8",
    "markdown>=3.10.2",
]

[tool.uv.sources]
agentura-commons = { workspace = true }

[project.optional-dependencies]
com = ["pywin32>=311"]
caldav = ["caldav>=1.4.0", "icalendar>=6.1.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, one level up from this package.
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real backend (COM/IMAP) - run with -m integration",
]
addopts = "-m 'not integration'"
