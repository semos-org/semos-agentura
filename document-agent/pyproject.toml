[project]
name = "document-agent"
dynamic = ["version"]
description = "Document digestion (OCR to Markdown) and composition (Markdown to documents) agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentura-commons",
    "httpx>=0.28",
    "mistralai>=1.12",
    "pypdf[crypto]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13",
    "python-dotenv>=1.2",
    "lxml>=5.0",
    "python-pptx>=1.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "pypdfium2>=4.0",
]

[tool.uv.sources]
agentura-commons = { workspace = true }

[project.scripts]
document-agent = "document_agent.cli:main"

[project.optional-dependencies]
slides = ["python-pptx>=1.0", "PyYAML>=6.0"]
image = ["rembg>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, one level up from this package.
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/document_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external tools (pandoc/marp/mmdc/libreoffice) - run with -m integration",
]
addopts = "-m 'not integration'"
