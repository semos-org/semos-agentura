[project]
name = "filesystem-agent"
version = "0.2.0"
description = "Virtual filesystem with multi-root VFS, SharePoint WebDAV, archive browsing, and MCP/A2A agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentura-commons",
    "httpx>=0.27.0,<1",
    "litellm>=1.30.0,!=1.82.7,!=1.82.8",
    "msal>=1.31.0",
    "nest-asyncio>=1.6.0",
    "panel>=1.7.1",
    "panelini",
    "playwright>=1.44.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "webdav4[fsspec]>=0.11.0",
]

[tool.uv.sources]
agentura-commons = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5.0",
    "wsgidav>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real backend credentials (SharePoint/WebDAV) - excluded in CI",
    "playwright: uses Playwright browser automation (chromium installed in CI)",
]
addopts = "-m 'not integration and not playwright'"
