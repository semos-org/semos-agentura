services:
  semos-agentura-email:
    build:
      context: .
      dockerfile: packages/semos-agentura-email/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
      - path: packages/semos-agentura-email/.env
        required: false
    restart: unless-stopped

  semos-agentura-document:
    build:
      context: .
      dockerfile: packages/semos-agentura-document/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
      - path: packages/semos-agentura-document/.env
        required: false
    restart: unless-stopped

  semos-agentura-ui:
    build:
      context: .
      dockerfile: packages/semos-agentura-ui/Dockerfile
    ports:
      - "5006:5006"
    env_file:
      - path: .env
        required: false
      - path: packages/semos-agentura-ui/.env
        required: false
    environment:
      - SEMOS_AGENTURA_EMAIL_BASE=http://semos-agentura-email:8001
      - SEMOS_AGENTURA_EMAIL_URL=http://semos-agentura-email:8001/mcp/sse
      - SEMOS_AGENTURA_DOCUMENT_BASE=http://semos-agentura-document:8002
      - SEMOS_AGENTURA_DOCUMENT_URL=http://semos-agentura-document:8002/mcp/sse
    depends_on:
      - semos-agentura-email
      - semos-agentura-document
    restart: unless-stopped
