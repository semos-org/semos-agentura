[project]
site_name = "Semos Agentura"
site_description = "Modular multi-agent system for professional and scientific workflows, built on MCP + A2A."
site_author = "Semos / OpenSemanticWorld"
site_url = "https://semos-org.github.io/semos-agentura/"
repo_url = "https://github.com/semos-org/semos-agentura"
repo_name = "semos-org/semos-agentura"
edit_uri = "edit/main/docs/"
copyright = 'Maintained by <a href="https://github.com/semos-org">Semos</a>.'

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Agent Architecture" = "agent-architecture.md" },
    { "File Handling" = "file-handling-spec.md" },
    { "Capabilities" = [
        { "Assistant Capabilities" = "capabilities/assistant_capabilities_usecase.md" },
        { "Image Generation and Diagram Embeds" = "capabilities/image_generation_and_diagram_embeds.md" },
    ] },
    { "API Reference" = "api.md" },
]

# API reference is generated by mkdocstrings (griffe static analysis) from the
# workspace package sources.
[project.plugins.mkdocstrings.handlers.python]
paths = [
    "agentura-commons/src",
    "email-agent/src",
    "document-agent/src",
    "filesystem-agent/src",
    "agentura-ui/src",
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/network"

# Auto / light / dark; the explicit choice is stored in localStorage and persists across pages.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/semos-org/semos-agentura"

# Markdown extensions (mermaid via superfences; arithmatex, tabbed, admonition, etc.).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
