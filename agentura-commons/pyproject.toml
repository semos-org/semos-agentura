[project]
name = "agentura-commons"
dynamic = ["version"]
description = "Shared MCP + A2A base classes for Semos Agentura agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "a2a-sdk[sqlite]>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic-settings>=2.13",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.2",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, one level up from this package.
raw-options = { root = ".." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"

[tool.hatch.build.targets.wheel]
packages = ["src/agentura_commons"]

[tool.deptry.per_rule_ignores]
# Reserved for the planned migration to langchain_mcp_adapters (see TODOs in mcp_*.py).
DEP002 = ["langchain-mcp-adapters"]
# httpx/pydantic arrive transitively via fastapi & pydantic-settings; google via a2a-sdk;
# the email/document agents are workspace siblings imported only by the test-helper module.
DEP003 = ["httpx", "pydantic", "google", "email_agent", "document_agent"]
