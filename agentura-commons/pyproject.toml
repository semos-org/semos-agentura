[project]
name = "agentura-commons"
version = "0.2.0"
description = "Shared MCP + A2A base classes for Semos Agentura agents"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.9",
    "a2a-sdk[sqlite]>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic-settings>=2.13",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.2",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"

[tool.hatch.build.targets.wheel]
packages = ["src/agentura_commons"]
