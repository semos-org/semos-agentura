[project]
name = "semos-agentura-email"
version = "0.5.0"
description = "Unified email client (IMAP/SMTP + Outlook COM) with LLM agent and archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "semos-agentura-core",
    "msal>=1.34.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "markdown>=3.10.2",
]

[tool.uv.sources]
semos-agentura-core = { workspace = true }

[project.optional-dependencies]
com = ["pywin32>=311"]
caldav = ["caldav>=1.4.0", "icalendar>=6.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry.package_module_name_map]
pywin32 = ["win32com", "pythoncom"]
# Workspace deps live under the shared PEP 420 `semos` namespace, so map the dist to its import root.
semos-agentura-core = "semos"
# Optional `caldav` extra: not installed in the base env, so declare module names explicitly
# (otherwise deptry only "assumes" them and prints a warning).
caldav = "caldav"
icalendar = "icalendar"

[tool.deptry.per_rule_ignores]
# caldav/icalendar are the optional `caldav` extra used only by the (planned) CalDAV client.
DEP002 = ["caldav", "icalendar"]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: ship src/semos (semos/ and semos/agentura/ have no __init__.py).
packages = ["src/semos"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real backend (COM/IMAP) - run with -m integration",
]
addopts = "-m 'not integration'"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "semos-agentura-email-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): semos-agentura-email v{version} [skip ci]"
# CI runs PSR from this package dir; refresh the workspace lockfile so the bumped
# version lands in uv.lock within the same release commit.
build_command = "uv lock"
assets = ["../../uv.lock"]

[tool.semantic_release.commit_parser_options]
# Only commits touching this package bump it.
path_filters = ["."]
