# Agentura UI - LLM provider configuration
#
# Copy to config.yml and adjust for your setup.
# Environment variables (${VAR}) are resolved at runtime.
#
# Supported client_type values: anthropic, openai, litellm

providers:
  # Azure AI Foundry with Anthropic models
  azure_anthropic:
    display_name: "Azure AI Foundry (Claude)"
    client_type: "anthropic"
    env_vars:
      api_key: "${AZURE_API_KEY}"
      endpoint: "${AZURE_API_BASE}"
    models:
      - name: "Claude Sonnet 4"
        value: "anthropic/claude-sonnet-4-6"

