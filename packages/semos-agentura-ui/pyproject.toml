[project]
name = "semos-agentura-ui"
version = "0.5.0"
description = "Panel-based chat client for Semos Agentura MCP agents"
requires-python = ">=3.11"
dependencies = [
    "panelini[ai]>=0.9.4",
    "semos-agentura-core",
    "semos-agentura-files",
    "langchain-community>=0.3",
    "langchain-core>=1.0",
    "mcp>=1.9",
    "httpx>=0.28",
    "panel>=1.7",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[tool.uv.sources]
semos-agentura-core = { workspace = true }
semos-agentura-files = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: ship src/semos (semos/ and semos/agentura/ have no __init__.py).
packages = ["src/semos"]

[tool.deptry.package_module_name_map]
# Workspace deps live under the shared PEP 420 `semos` namespace, so map the dists to its import root.
semos-agentura-core = "semos"
semos-agentura-files = "semos"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ui: browser tests requiring Playwright"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "semos-agentura-ui-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): semos-agentura-ui v{version} [skip ci]"
# CI runs PSR from this package dir; refresh the workspace lockfile so the bumped
# version lands in uv.lock within the same release commit.
build_command = "uv lock"
assets = ["../../uv.lock"]

[tool.semantic_release.commit_parser_options]
# Only commits touching this package bump it.
path_filters = ["."]
