[project]
name = "semos-agentura-files"
dynamic = ["version"]
description = "Virtual filesystem with multi-root VFS, SharePoint WebDAV, archive browsing, and MCP/A2A agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "semos-agentura-core",
    "httpx>=0.27.0,<1",
    "litellm>=1.30.0,!=1.82.7,!=1.82.8",
    "msal>=1.31.0",
    "nest-asyncio>=1.6.0",
    "panel>=1.7.1",
    "panelini>=0.9.4",
    "playwright>=1.44.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "fsspec>=2023.1",
    "webdav4[fsspec]>=0.11.0",
]

[tool.uv.sources]
semos-agentura-core = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5.0",
    "wsgidav>=4.3.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, two levels up (packages/<pkg>/).
raw-options = { root = "../.." }

[tool.deptry.package_module_name_map]
# Workspace deps live under the shared PEP 420 `semos` namespace, so map the dist to its import root.
semos-agentura-core = "semos"
# Test-only `wsgidav` (in the `test` extra): not installed in the base env, so declare its module name
# explicitly (otherwise deptry only "assumes" it and prints a warning).
wsgidav = "wsgidav"

[tool.deptry.per_rule_ignores]
# Test-only deps declared in the `test` extra (exercised under tests/, not scanned src/).
DEP002 = ["pytest", "pytest-asyncio", "pytest-playwright", "wsgidav"]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: ship src/semos (semos/ and semos/agentura/ have no __init__.py).
packages = ["src/semos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real backend credentials (SharePoint/WebDAV) - excluded in CI",
    "playwright: uses Playwright browser automation (chromium installed in CI)",
]
addopts = "-m 'not integration and not playwright'"
