[project]
name = "semos-agentura-document"
dynamic = ["version"]
description = "Document digestion (OCR to Markdown) and composition (Markdown to documents) agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "semos-agentura-core",
    "httpx>=0.28",
    "mistralai>=1.12",
    "pypdf[crypto]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.13",
    "python-dotenv>=1.2",
    "lxml>=5.0",
    "python-pptx>=1.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "pypdfium2>=4.0",
]

[tool.uv.sources]
semos-agentura-core = { workspace = true }

[project.scripts]
semos-agentura-document = "semos.agentura.document.cli:main"

[project.optional-dependencies]
slides = ["python-pptx>=1.0", "PyYAML>=6.0"]
image = ["rembg>=2.0"]
# Optional Outlook/PowerPoint COM automation on Windows (mirrors email-agent's `com` extra).
com = ["pywin32>=311"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Monorepo: the git root is the workspace root, two levels up (packages/<pkg>/).
raw-options = { root = "../.." }

[tool.deptry.package_module_name_map]
pywin32 = ["win32com", "pythoncom"]
# Workspace deps live under the shared PEP 420 `semos` namespace, so map the dist to its import root.
semos-agentura-core = "semos"
# Optional `image` extra: not installed in the base env, so declare its module name explicitly
# (otherwise deptry only "assumes" it and prints a warning).
rembg = "rembg"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: ship src/semos (semos/ and semos/agentura/ have no __init__.py).
packages = ["src/semos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external tools (pandoc/marp/mmdc/libreoffice) - run with -m integration",
]
addopts = "-m 'not integration'"
